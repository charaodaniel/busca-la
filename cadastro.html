<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Busca Lá - Criar conta">
  <link rel="manifest" href="/src/public/manifest.webmanifest">
  <title>Criar conta · Busca Lá</title>
  <link rel="icon" type="image/png" href="/src/public/images/logo.png">
  <style>
    :root { --primary:#16a34a; --primary-dark:#15803d; --dark:#111827; --gray:#6b7280; --light:#f3f4f6; --border:#e5e7eb; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .card {
      background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.4);
      width:100%; max-width:480px; padding:36px 32px;
    }
    .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; }
    .logo img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
    .logo span { font-size:24px; font-weight:800; color:var(--dark); }
    .logo span b { color:var(--primary); }
    .sub { text-align:center; color:var(--gray); font-size:14px; margin-bottom:24px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--dark); margin:14px 0 6px; }
    input, select {
      width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px;
      font-size:15px; outline:none; transition:border .15s; background:#fff;
    }
    input:focus, select:focus { border-color:var(--primary); }
    .hint { font-size:12px; color:var(--gray); margin-top:5px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button {
      width:100%; margin-top:24px; padding:13px; border:none; border-radius:10px;
      background:var(--primary); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
      transition:background .15s;
    }
    button:hover { background:var(--primary-dark); }
    button:disabled { opacity:.6; cursor:wait; }
    .msg { display:none; margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13.5px; }
    .msg.err { display:block; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .msg.ok { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .foot { text-align:center; margin-top:20px; font-size:14px; color:var(--gray); }
    .foot a { color:var(--primary); font-weight:600; text-decoration:none; }
    .voltar { display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--gray); text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <img src="/src/public/images/logo.png" alt="BuscaLá">
      <span>Busca<b>Lá</b></span>
    </div>
    <p class="sub">Crie sua conta em menos de 1 minuto</p>

    <form id="formCad" novalidate>
      <label for="nome">Nome completo *</label>
      <input id="nome" type="text" placeholder="Seu nome" required>

      <div class="row">
        <div>
          <label for="username">Nome de usuário</label>
          <input id="username" type="text" placeholder="ex.: joao.silva" autocomplete="username">
        </div>
        <div>
          <label for="papel">Tipo de conta *</label>
          <select id="papel">
            <option value="solicitante" selected>Solicitante</option>
            <option value="entregador">Entregador</option>
            <option value="operador">Operador</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="voce@email.com" autocomplete="email">
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input id="telefone" type="tel" placeholder="(55) 99639-3353" autocomplete="tel">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00">
        </div>
        <div>
          <label for="senha">Senha *</label>
          <input id="senha" type="password" placeholder="Mín. 6 caracteres" autocomplete="new-password" required>
        </div>
      </div>

      <p class="hint">* obrigatórios · informe pelo menos um identificador: usuário, e-mail, telefone ou CPF</p>

      <button type="submit" id="btnCriar">Criar conta</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="foot">Já tem conta? <a href="/login">Entrar</a></p>
    <a class="voltar" href="/">← Voltar ao início</a>
  </main>

<script>
const form = document.getElementById('formCad');
const msg = document.getElementById('msg');
const btn = document.getElementById('btnCriar');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  const nome = document.getElementById('nome').value.trim();
  const senha = document.getElementById('senha').value;
  const identificadores = ['username', 'email', 'telefone', 'cpf']
    .map(id => document.getElementById(id).value.trim())
    .filter(Boolean);

  if (nome.length < 3) { showMsg('Informe seu nome completo.', 'err'); return; }
  if (senha.length < 6) { showMsg('A senha deve ter pelo menos 6 caracteres.', 'err'); return; }
  if (identificadores.length === 0) {
    showMsg('Informe pelo menos um identificador: usuário, e-mail, telefone ou CPF.', 'err');
    return;
  }

  btn.disabled = true; btn.textContent = 'Criando conta...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome,
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        senha,
        papel: document.getElementById('papel').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error || 'Falha ao criar conta.', 'err'); return; }
    showMsg('Conta criada! Bem-vindo, ' + data.user.nome.split(' ')[0] + '!', 'ok');
    setTimeout(() => { window.location.href = '/dashboard'; }, 700);
  } catch {
    showMsg('Erro de conexão. Tente novamente.', 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Criar conta';
  }
});
</script>
</body>
</html>
