<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Busca Lá - Entrar">
  <link rel="manifest" href="/src/public/manifest.webmanifest">
  <title>Entrar · Busca Lá</title>
  <link rel="icon" type="image/png" href="/src/public/images/logo.png">
  <style>
    :root { --primary:#16a34a; --primary-dark:#15803d; --dark:#111827; --gray:#6b7280; --light:#f3f4f6; --border:#e5e7eb; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .card {
      background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.4);
      width:100%; max-width:420px; padding:36px 32px;
    }
    .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; }
    .logo img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
    .logo span { font-size:24px; font-weight:800; color:var(--dark); }
    .logo span b { color:var(--primary); }
    .sub { text-align:center; color:var(--gray); font-size:14px; margin-bottom:28px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--dark); margin:16px 0 6px; }
    input {
      width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
      font-size:15px; outline:none; transition:border .15s;
    }
    input:focus { border-color:var(--primary); }
    .hint { font-size:12px; color:var(--gray); margin-top:5px; }
    button {
      width:100%; margin-top:24px; padding:13px; border:none; border-radius:10px;
      background:var(--primary); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
      transition:background .15s;
    }
    button:hover { background:var(--primary-dark); }
    button:disabled { opacity:.6; cursor:wait; }
    .msg { display:none; margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13.5px; }
    .msg.err { display:block; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .msg.ok { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .foot { text-align:center; margin-top:20px; font-size:14px; color:var(--gray); }
    .foot a { color:var(--primary); font-weight:600; text-decoration:none; }
    .voltar { display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--gray); text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <img src="/src/public/images/logo.png" alt="BuscaLá">
      <span>Busca<b>Lá</b></span>
    </div>
    <p class="sub">Entre com usuário, e-mail, telefone ou CPF</p>

    <form id="formLogin" novalidate>
      <label for="identifier">Usuário, e-mail, telefone ou CPF</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username"
             placeholder="ex.: 55996393353" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password"
             placeholder="Sua senha" required>

      <button type="submit" id="btnEntrar">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="foot">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    <a class="voltar" href="/">← Voltar ao início</a>
  </main>

<script>
const form = document.getElementById('formLogin');
const msg = document.getElementById('msg');
const btn = document.getElementById('btnEntrar');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        identifier: document.getElementById('identifier').value.trim(),
        senha: document.getElementById('senha').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error || 'Falha ao entrar.', 'err'); return; }
    showMsg('Bem-vindo, ' + (data.user.nome.split(' ')[0]) + '! Redirecionando...', 'ok');
    setTimeout(() => { window.location.href = '/dashboard'; }, 600);
  } catch {
    showMsg('Erro de conexão. Tente novamente.', 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
